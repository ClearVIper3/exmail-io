<!-- 预定会议卡片（HR/面谈类，已预定但需确认时间）
  占位符：TITLE TIME LOCATION HOST
-->
<table style="width:100%;max-width:520px;border:1px solid #d8e1f3;border-radius:6px;border-collapse:separate;background:#f3f7ff;font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;">
  <tr>
    <td style="padding:14px 16px;border-bottom:1px solid #d8e1f3;">
      <span style="font-size:14px;font-weight:600;color:#1d2129;">📌 预定会议</span>
      <span style="float:right;display:inline-block;padding:2px 8px;background:#fff7e6;color:#ff7d00;font-size:12px;border-radius:10px;border:1px solid #ffe1ad;">待确认时间</span>
    </td>
  </tr>
  <tr>
    <td style="padding:16px;font-size:13px;color:#4e5969;line-height:2;">
      <div style="font-size:15px;font-weight:600;color:#1d2129;margin-bottom:6px;">{{TITLE}}</div>
      <div><span style="color:#86909c;display:inline-block;width:70px;">时间：</span><span style="color:#1d2129;">{{TIME}}</span></div>
      <div><span style="color:#86909c;display:inline-block;width:70px;">地点：</span><span style="color:#1d2129;">{{LOCATION}}</span></div>
      <div><span style="color:#86909c;display:inline-block;width:70px;">面谈人：</span><span style="color:#1d2129;">{{HOST}}</span></div>
    </td>
  </tr>
</table>
