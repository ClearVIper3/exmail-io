<!-- 邮件线程引用原文块 -->
<!-- 变量: {{QUOTE_SENDER}}, {{QUOTE_DATE}}, {{QUOTE_CONTENT}} -->
<div style="border-left:3px solid #ccc; padding:8px 12px; margin:16px 0; color:#666; font-size:13px; background:#f8f8f8;">
  <div style="font-size:11px; color:#999; margin-bottom:6px;">
    --------- 原始邮件 ---------<br>
    发件人: {{QUOTE_SENDER}}<br>
    日期: {{QUOTE_DATE}}<br>
  </div>
  <div style="white-space:pre-wrap;">{{QUOTE_CONTENT}}</div>
</div>
