<!-- 超大附件/微盘附件/外域附件 链接卡片 -->
<!-- 变量: {{FILE_NAME}}, {{FILE_SIZE}}, {{SOURCE_TYPE}}, {{LINK_URL}}, {{STATUS}} -->
<!-- SOURCE_TYPE: QQ超大附件 / 微盘附件 / 企业网盘附件 / 外域超大附件(Gmail) / 外域超大附件(163) -->
<!-- STATUS: 可下载 / 已过期 / 无权限 / 链接失效 -->
<div style="border:1px solid #e0e0e0; border-radius:8px; padding:12px 16px; margin:12px 0; background:#f9f9f9; max-width:480px;">
  <div style="display:flex; align-items:center; margin-bottom:8px;">
    <span style="font-size:20px; margin-right:8px;">📎</span>
    <span style="font-weight:bold; color:#333;">{{FILE_NAME}}</span>
  </div>
  <div style="font-size:12px; color:#888; margin-bottom:8px;">
    <span>{{SOURCE_TYPE}}</span> · <span>{{FILE_SIZE}}</span>
  </div>
  <div style="margin-bottom:8px;">
    <a href="{{LINK_URL}}" style="color:#1a73e8; text-decoration:none; font-size:13px;">点击下载 / 在线预览 →</a>
  </div>
  <div style="font-size:11px; color:#999; padding-top:6px; border-top:1px solid #eee;">
    状态：<span style="color:{{STATUS_COLOR}};">{{STATUS}}</span> · 有效期至 {{EXPIRE_DATE}}
  </div>
</div>
