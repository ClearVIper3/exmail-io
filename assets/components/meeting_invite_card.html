<!-- 日程邀约卡片
  占位符：TITLE TIME LOCATION ORGANIZER ATTENDEES
-->
<table style="width:100%;max-width:520px;border:1px solid #e5e6eb;border-radius:6px;border-collapse:separate;background:#fff;font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;">
  <tr>
    <td style="padding:14px 16px;background:linear-gradient(90deg,#165dff,#4080ff);color:#fff;border-radius:6px 6px 0 0;">
      <span style="font-size:14px;font-weight:600;">📅 日程邀约</span>
      <span style="float:right;font-size:12px;opacity:0.9;">需确认出席</span>
    </td>
  </tr>
  <tr>
    <td style="padding:16px;font-size:13px;color:#4e5969;line-height:2;">
      <div style="font-size:15px;font-weight:600;color:#1d2129;margin-bottom:8px;">{{TITLE}}</div>
      <div><span style="color:#86909c;display:inline-block;width:70px;">⏰ 时间：</span><span style="color:#1d2129;">{{TIME}}</span></div>
      <div><span style="color:#86909c;display:inline-block;width:70px;">📍 地点：</span><span style="color:#1d2129;">{{LOCATION}}</span></div>
      <div><span style="color:#86909c;display:inline-block;width:70px;">👤 组织者：</span><span style="color:#1d2129;">{{ORGANIZER}}</span></div>
      <div><span style="color:#86909c;display:inline-block;width:70px;">👥 参会人：</span><span style="color:#1d2129;">{{ATTENDEES}}</span></div>
    </td>
  </tr>
  <tr>
    <td style="padding:12px 16px;background:#fafbfc;border-top:1px solid #e5e6eb;border-radius:0 0 6px 6px;text-align:center;">
      <a href="#" style="display:inline-block;padding:6px 18px;background:#00b42a;color:#fff;text-decoration:none;border-radius:4px;font-size:13px;">✓ 接受</a>
      <a href="#" style="display:inline-block;padding:6px 18px;margin-left:8px;background:#ff7d00;color:#fff;text-decoration:none;border-radius:4px;font-size:13px;">? 暂定</a>
      <a href="#" style="display:inline-block;padding:6px 18px;margin-left:8px;background:#fff;color:#4e5969;border:1px solid #c9cdd4;text-decoration:none;border-radius:4px;font-size:13px;">✗ 拒绝</a>
    </td>
  </tr>
</table>
