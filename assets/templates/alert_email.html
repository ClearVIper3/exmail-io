<!DOCTYPE html>
<html>
<body style="font-family:'Microsoft YaHei',Arial,sans-serif; margin:0; padding:20px; background:#fff;">
<!-- 监控告警邮件模板 -->
<!-- 变量: {{ALERT_LEVEL}}, {{ALERT_COLOR}}, {{SERVICE_NAME}}, {{ALERT_TITLE}}, {{IMPACT}}, {{OWNER_LIST}}, {{START_TIME}}, {{DETAIL_LINK}}, {{BODY_TEXT}} -->

<div style="border-left:4px solid {{ALERT_COLOR}}; padding:12px 16px; margin-bottom:16px; background:#fff8f8;">
  <span style="background:{{ALERT_COLOR}}; color:#fff; font-size:12px; font-weight:bold; padding:2px 8px; border-radius:4px;">{{ALERT_LEVEL}}</span>
  <span style="font-weight:bold; font-size:16px; color:#333; margin-left:8px;">{{ALERT_TITLE}}</span>
</div>

<table style="font-size:14px; color:#333; border-collapse:collapse; margin-bottom:16px; width:100%;">
  <tr><td style="padding:6px 16px 6px 0; font-weight:bold; color:#666; white-space:nowrap;">服务名称</td><td>{{SERVICE_NAME}}</td></tr>
  <tr><td style="padding:6px 16px 6px 0; font-weight:bold; color:#666; white-space:nowrap;">影响范围</td><td>{{IMPACT}}</td></tr>
  <tr><td style="padding:6px 16px 6px 0; font-weight:bold; color:#666; white-space:nowrap;">服务责任人</td><td>{{OWNER_LIST}}</td></tr>
  <tr><td style="padding:6px 16px 6px 0; font-weight:bold; color:#666; white-space:nowrap;">触发时间</td><td>{{START_TIME}}</td></tr>
</table>

<div style="font-size:14px; color:#333; line-height:1.8; margin-bottom:16px;">
{{BODY_TEXT}}
</div>

<div style="margin-top:16px; padding-top:12px; border-top:1px solid #eee;">
  <a href="{{DETAIL_LINK}}" style="display:inline-block; background:#d32f2f; color:#fff; padding:8px 20px; border-radius:4px; text-decoration:none; font-size:13px; font-weight:bold;">查看告警详情</a>
</div>

<div style="margin-top:24px; padding-top:12px; border-top:1px solid #eee; font-size:11px; color:#999;">
  此邮件由监控告警系统自动发送，请勿直接回复。如需处理请登录监控平台操作。
</div>
</body>
</html>
